[package]
name = "frame"
version = "0.5.0"
edition = "2021"
license = "MIT"
description = "Screenshots with global shortcuts on any Linux desktop: CLI, tray and settings window"
publish = false

[[bin]]
name = "frame"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
ksni = { version = "=0.3.6", default-features = false, features = ["tokio", "blocking"] }
png = "0.18"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
libc = "0.2"
# Already in the tree via eframe (same version, its features): Record taps
# winit's key events, where Meta and Print still exist (egui drops them).
winit = { version = "=0.30.13", default-features = false }
# Already in the tree via ksni/ashpd (same version, tokio): --grab calls
# KWin's ScreenShot2 with the blocking API (no new crates).
zbus = { version = "=5.15.0", default-features = false, features = ["tokio", "blocking-api"] }
# Already in the tree via winit/smithay-client-toolkit (same versions):
# the Wayland clipboard (wlr data-control), so no wl-copy is needed.
wayland-client = "=0.31.15"
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] }
# Hyprland's and Sway's IPC answer in JSON.
serde_json = "1"
# Screen capture and the region selector without grim/slurp: screencopy
# (wlr, ext-image-copy-capture), layer-shell, xdg-shell, xdg-output and
# cursor-shape. Same versions as in the tree via winit/sctk.
wayland-protocols = { version = "=0.32.13", features = ["client", "staging", "unstable"] }
# X11 capture, region selector and clipboard owner (no maim/import/xclip).
# Already in the tree via winit (same version); its pure-Rust connection.
x11rb = { version = "=0.13.2", features = ["randr"] }
# JPG and WebP without ffmpeg; crop/rotate/scale. image is in the tree via
# eframe; jpeg reuses zune-jpeg 0.5.15 from the tree, webp adds image-webp
# (image-rs's own pure-Rust codec) and its two small deps.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
